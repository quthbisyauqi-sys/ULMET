<!DOCTYPE html>
<html><head>
    <link rel="manifest" href="manifest.json"><title>ULMET - Membersihkan Cache...</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;}
.box{max-width:400px;padding:40px;}.spinner{font-size:48px;animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}</style></head>
<body><div class="box">
<div class="spinner">⚙️</div>
<h2>Membersihkan cache ULMET...</h2>
<p id="status" style="color:#93c5fd;font-size:14px;">Menghapus Service Worker & Cache...</p>
<script>
(async function(){
    var s = document.getElementById('status');
    try {
        if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var r of regs) { await r.unregister(); }
            s.textContent = 'Service Worker dihapus (' + regs.length + ')...';
        }
        if ('caches' in window) {
            var keys = await caches.keys();
            for (var k of keys) { await caches.delete(k); }
            s.textContent = 'Cache dihapus (' + keys.length + ')...';
        }
        s.textContent = '✅ Berhasil! Mengarahkan ke Materi Dosen...';
        setTimeout(function(){ window.location.href = 'materi.html?v=' + Date.now(); }, 1000);
    } catch(e) {
        s.textContent = 'Error: ' + e.message;
        setTimeout(function(){ window.location.href = 'materi.html?v=' + Date.now(); }, 2000);
    }
})();
</script>
</div><script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
</body></html>
