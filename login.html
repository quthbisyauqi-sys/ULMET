<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Masuk - ULMET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #070d1a;
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .bg-grid {
            background-size: 36px 36px;
            background-image:
                linear-gradient(to right, rgba(59,130,246,0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59,130,246,0.06) 1px, transparent 1px);
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: float 12s ease-in-out infinite alternate;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 0.4; }
            100% { transform: translateY(-20px) scale(1.08); opacity: 0.6; }
        }
        /* Transisi layar */
        .s-hidden { opacity: 0; transform: translateY(16px) scale(0.97); pointer-events: none; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        .s-visible { opacity: 1; transform: none; pointer-events: auto; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        .s-exit { opacity: 0; transform: translateY(-16px) scale(0.97); pointer-events: none; transition: all 0.3s ease; }
        /* Input styling */
        input:focus { box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.15); }
        /* Scrollbar tipis untuk onboarding */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.4); border-radius: 2px; }
    </style>
</head>
<body class="relative flex items-center justify-center min-h-screen p-4 overflow-x-hidden">

    <!-- Background -->
    <div class="fixed inset-0 bg-grid z-0"></div>
    <div class="orb w-[420px] h-[420px] bg-blue-700/40 top-[-80px] left-[-80px]"></div>
    <div class="orb w-[380px] h-[380px] bg-indigo-600/25 bottom-[-60px] right-[-60px]" style="animation-delay:-6s;"></div>
    <div class="orb w-[250px] h-[250px] bg-yellow-500/10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" style="animation-delay:-3s;"></div>

    <!-- ================================ -->
    <!-- SCREEN 1: LOGIN -->
    <!-- ================================ -->
    <div id="screen-login" class="relative z-10 w-full max-w-md s-visible">
        <div class="glass p-7 sm:p-9 rounded-3xl">

            <!-- Logo -->
            <div class="flex flex-col items-center text-center mb-7">
                <div class="w-20 h-20 bg-gradient-to-tr from-yellow-400 via-amber-300 to-yellow-200 rounded-2xl flex items-center justify-center shadow-xl shadow-yellow-500/20 mb-4 rotate-3 hover:rotate-6 transition-transform cursor-default">
                    <span class="text-4xl font-black text-slate-950 -rotate-3 select-none">U</span>
                </div>
                <h1 class="text-3xl font-black text-white tracking-tight">ULMET</h1>
                <p class="text-xs text-blue-300/90 font-medium mt-1">Asisten Cerdas Mahasiswa</p>
                <div class="mt-2.5 inline-flex items-center gap-1.5 px-3 py-1 bg-blue-950/70 border border-blue-800/50 rounded-full text-[11px] text-blue-200">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Portal Masuk Akun ULMET
                </div>
            </div>

            <!-- Alert Error -->
            <div id="login-err" class="hidden mb-5 p-3.5 rounded-xl bg-red-950/70 border border-red-500/50 text-red-200 text-xs flex items-start gap-2.5">
                <span class="shrink-0 mt-0.5">⚠️</span>
                <span id="login-err-msg">Username atau kata sandi tidak cocok.</span>
            </div>

            <!-- Form Login -->
            <form id="form-login" class="space-y-4">

                <div>
                    <label class="text-xs font-bold text-blue-200 uppercase tracking-wider block mb-1.5 ml-0.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-blue-400 pointer-events-none">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </span>
                        <input type="text" id="inp-username" required autofocus autocomplete="username"
                            class="w-full bg-slate-900/90 border border-blue-900/70 text-white placeholder-slate-500 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-yellow-400 transition"
                            placeholder="Masukkan username kamu">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-xs font-bold text-blue-200 uppercase tracking-wider ml-0.5">Kata Sandi</label>
                        <button type="button" onclick="togglePwd()" class="text-[11px] text-blue-300 hover:text-yellow-400 transition flex items-center gap-1">
                            <span id="pwd-icon">👁️</span> <span id="pwd-txt">Tampilkan</span>
                        </button>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-blue-400 pointer-events-none">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </span>
                        <input type="password" id="inp-password" required autocomplete="current-password"
                            class="w-full bg-slate-900/90 border border-blue-900/70 text-white placeholder-slate-500 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-yellow-400 transition"
                            placeholder="Masukkan kata sandi">
                    </div>
                </div>

                <button type="submit" id="btn-login"
                    class="w-full mt-1 bg-gradient-to-r from-yellow-400 to-amber-400 hover:brightness-110 text-slate-950 font-black py-3.5 rounded-xl shadow-[0_4px_20px_rgba(250,204,21,0.3)] transition active:scale-[0.98] flex items-center justify-center gap-2">
                    <span id="btn-login-label">Masuk ke ULMET 🚀</span>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-blue-900/40 text-center space-y-2">
                <p class="text-xs text-blue-300/80">Belum punya akun atau butuh bantuan?</p>
                <a href="https://wa.me/62895384287654?text=Halo%20Admin%20ULMET,%20saya%20butuh%20bantuan%20akun" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-emerald-950/60 hover:bg-emerald-900/70 border border-emerald-500/40 text-emerald-300 hover:text-emerald-200 rounded-xl text-xs font-bold transition active:scale-95 shadow-md shadow-emerald-950/40">
                    <span class="text-base">💬</span>
                    <span>Hubungi Admin: <span class="text-yellow-400 font-mono tracking-wide">0895384287654</span></span>
                </a>
            </div>

        </div>
    </div>

    <!-- ================================ -->
    <!-- SCREEN 2: ONBOARDING PROFIL -->
    <!-- Tampil jika user baru, belum ada profil -->
    <!-- ================================ -->
    <div id="screen-onboard" class="relative z-10 w-full max-w-lg s-hidden" style="display:none;">
        <div class="glass p-7 sm:p-9 rounded-3xl">

            <div class="text-center mb-6">
                <div id="ob-avatar" class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-2xl font-black text-white mb-3 shadow-lg shadow-blue-700/30 border border-blue-400/20 transition-all">
                    🎓
                </div>
                <h2 class="text-xl font-black text-white">Halo, <span id="ob-username" class="text-yellow-400">Mahasiswa</span>! 👋</h2>
                <p class="text-xs text-blue-300/80 mt-1">Lengkapi biodata untuk memulai ULMET. Hanya perlu sekali!</p>
            </div>

            <div id="ob-err" class="hidden mb-4 p-3 rounded-xl bg-red-950/60 border border-red-500/50 text-red-200 text-xs flex gap-2">
                <span>⚠️</span> <span id="ob-err-msg">Gagal menyimpan. Coba lagi.</span>
            </div>

            <form id="form-onboard" class="space-y-3.5">

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-blue-200 uppercase tracking-wider block mb-1">Nama Lengkap</label>
                        <input type="text" id="ob-nama" required
                            class="w-full bg-slate-900/90 border border-blue-900/70 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-yellow-400 transition"
                            placeholder="Ahmad Baihaqi" oninput="updateAvatar()">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-blue-200 uppercase tracking-wider block mb-1">Nama Panggilan</label>
                        <input type="text" id="ob-panggilan" required
                            class="w-full bg-slate-900/90 border border-blue-900/70 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-yellow-400 transition"
                            placeholder="Oqi">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-blue-200 uppercase tracking-wider block mb-1">NIM / NPM</label>
                        <input type="text" id="ob-nim" required
                            class="w-full bg-slate-900/90 border border-blue-900/70 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-yellow-400 transition"
                            placeholder="210102003">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-blue-200 uppercase tracking-wider block mb-1">Semester</label>
                        <select id="ob-semester" required
                            class="w-full bg-slate-900/90 border border-blue-900/70 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-yellow-400 transition cursor-pointer">
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5" selected>Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8 (Skripsi)</option>
                            <option value="9+">Semester 9+</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-bold text-blue-200 uppercase tracking-wider block mb-1">Program Studi / Jurusan</label>
                    <input type="text" id="ob-prodi" required
                        class="w-full bg-slate-900/90 border border-blue-900/70 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-yellow-400 transition"
                        placeholder="Cth: Sastra Arab / Teknik Informatika">
                </div>

                <button type="submit" id="btn-onboard"
                    class="w-full mt-4 bg-gradient-to-r from-yellow-400 to-amber-400 hover:brightness-110 text-slate-950 font-black py-3.5 rounded-xl shadow-[0_4px_20px_rgba(250,204,21,0.3)] transition active:scale-[0.98] flex items-center justify-center gap-2">
                    <span id="btn-onboard-label">Simpan & Buka Dashboard 🚀</span>
                </button>
            </form>

        </div>
    </div>

    <!-- =========================== -->
    <!-- =========================== -->
    <!-- SCRIPT — setelah body load -->
    <!-- =========================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // ─── KONSTANTA & HELPER ───
        const EMAIL_DOMAIN = '@ulmet.app';
        const toEmail = (u) => (typeof usernameToEmail === 'function' ? usernameToEmail(u) : u.toLowerCase().trim() + EMAIL_DOMAIN);
        const toUname = (e) => (typeof emailToUsername === 'function' ? emailToUsername(e) : (e || '').replace(EMAIL_DOMAIN, ''));

        const getSb = () => getSupabase();

        let loggedUser = null;   // menyimpan data user Supabase setelah login

        // ─── HELPER UI ───
        function togglePwd() {
            const inp = document.getElementById('inp-password');
            const icon = document.getElementById('pwd-icon');
            const txt  = document.getElementById('pwd-txt');
            if (inp.type === 'password') {
                inp.type = 'text'; icon.textContent = '🙈'; txt.textContent = 'Sembunyikan';
            } else {
                inp.type = 'password'; icon.textContent = '👁️'; txt.textContent = 'Tampilkan';
            }
        }

        function showLoginErr(msg) {
            const box = document.getElementById('login-err');
            document.getElementById('login-err-msg').textContent = msg;
            box.classList.remove('hidden');
        }
        function hideLoginErr() { document.getElementById('login-err').classList.add('hidden'); }

        function updateAvatar() {
            const v = document.getElementById('ob-nama').value.trim();
            const el = document.getElementById('ob-avatar');
            el.textContent = v ? v[0].toUpperCase() : '🎓';
        }

        // ─── TRANSISI LAYAR ───
        const loginEl   = document.getElementById('screen-login');
        const onboardEl = document.getElementById('screen-onboard');

        function goToOnboarding(username) {
            document.getElementById('ob-username').textContent = username;

            // Keluar dari layar login
            loginEl.classList.remove('s-visible');
            loginEl.classList.add('s-exit');

            setTimeout(() => {
                loginEl.style.display = 'none';
                onboardEl.style.display = 'block';
                void onboardEl.offsetWidth;
                onboardEl.classList.remove('s-hidden');
                onboardEl.classList.add('s-visible');
            }, 320);
        }

        // ─── CEK SESI SAAT HALAMAN DIBUKA ───
        document.addEventListener('DOMContentLoaded', async () => {
            // Cek apakah ada request logout eksplisit
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('logout') === 'true') {
                sessionStorage.removeItem('ulmet_admin_ok');
                localStorage.removeItem('ulmet_admin_session');
                try { await logoutUser(); } catch(e) {}
                return;
            }

            try {
                const sb = getSb();
                if (!sb) return;
                const { data: { session } } = await sb.auth.getSession();
                if (session?.user) {
                    await routeAfterAuth(session.user);
                }
            } catch (e) {
                console.warn('Gagal baca sesi:', e);
            }
        });

        // ─── SETELAH AUTH: CEK APAKAH ADMIN ATAU MAHASISWA & RUTEKAN ───
        async function routeAfterAuth(user) {
            loggedUser = user;
            setCurrentUserId(user.id);
            clearLegacyLocalStorage();
            const username = toUname(user.email);
            const meta = user.user_metadata || {};

            // 👑 1. JIKA AKUN ADMIN -> MASUK KE DASHBOARD ADMIN (admin.html)
            const isAdmin = username === 'admin' || meta.role === 'admin' || meta.is_admin === true;
            if (isAdmin) {
                sessionStorage.setItem('ulmet_admin_ok', '1');
                localStorage.setItem('ulmet_admin_session', '1');
                window.location.href = 'admin.html';
                return;
            }

            // 🎓 2. JIKA AKUN MAHASISWA -> MASUK KE AKUN MAHASISWA
            sessionStorage.removeItem('ulmet_admin_ok');
            localStorage.removeItem('ulmet_admin_session');

            localStorage.setItem(userKey('ulmet_account'), JSON.stringify({
                id: user.id,
                username,
                email: user.email
            }));
            localStorage.setItem('ulmet_account', JSON.stringify({
                id: user.id,
                username,
                email: user.email
            }));

            // Cek apakah profil mahasiswa sudah lengkap di database
            try {
                const { data: profile } = await getSb()
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .maybeSingle();

                if (profile?.nama && profile?.nim) {
                    // Profil lengkap — langsung masuk ke Dashboard mahasiswa
                    localStorage.setItem(userKey('ulmet_profile'), JSON.stringify(profile));
                    localStorage.setItem('ulmet_profile', JSON.stringify(profile));
                    window.location.href = 'dashboard.html';
                    return;
                }
            } catch (_) {}

            // Belum ada profil (akun baru dibuat admin) — tampilkan onboarding
            goToOnboarding(username);
        }

        // ─── SUBMIT LOGIN (SATU PINTU UNTUK ADMIN & MAHASISWA) ───
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideLoginErr();

            const username = document.getElementById('inp-username').value.trim().toLowerCase();
            const password = document.getElementById('inp-password').value;

            if (!username || !password) {
                showLoginErr('Harap isi username dan kata sandi.');
                return;
            }

            const btn   = document.getElementById('btn-login');
            const label = document.getElementById('btn-login-label');
            btn.disabled = true;
            label.textContent = 'Memverifikasi... ⏳';

            // Kredensial Admin cadangan / lokal (PIN)
            const configuredPin = localStorage.getItem('ulmet_admin_pin') || 'ulmet123';
            const isLocalAdminMatch = (username === 'admin' && (
                password === configuredPin || 
                password === 'admin123' || 
                password === 'ulmet123'
            ));

            try {
                const email = toEmail(username);
                let authUser = null;

                try {
                    const { data, error } = await getSb().auth.signInWithPassword({ email, password });
                    if (!error && data?.user) {
                        authUser = data.user;
                    } else if (error && !isLocalAdminMatch) {
                        throw error;
                    }
                } catch(authErr) {
                    if (!isLocalAdminMatch) throw authErr;
                }

                // 1. Berhasil login via Supabase Auth
                if (authUser) {
                    const meta = authUser.user_metadata || {};
                    const isAdmin = username === 'admin' || meta.role === 'admin' || meta.is_admin === true;
                    if (isAdmin) {
                        sessionStorage.setItem('ulmet_admin_ok', '1');
                        localStorage.setItem('ulmet_admin_session', '1');
                        label.textContent = 'Login Admin Berhasil! 👑';
                        setTimeout(() => window.location.href = 'admin.html', 300);
                        return;
                    }

                    // Mahasiswa
                    label.textContent = 'Masuk ke Akun... 🚀';
                    await routeAfterAuth(authUser);
                    return;
                }

                // 2. Berhasil login admin via verifikasi PIN lokal
                if (isLocalAdminMatch) {
                    sessionStorage.setItem('ulmet_admin_ok', '1');
                    localStorage.setItem('ulmet_admin_session', '1');
                    label.textContent = 'Login Admin Berhasil! 👑';
                    setTimeout(() => window.location.href = 'admin.html', 300);
                    return;
                }

                throw new Error('Username atau kata sandi tidak cocok.');

            } catch (err) {
                let msg = err.message || 'Terjadi kesalahan.';
                if (/invalid.login|invalid_credentials/i.test(msg)) {
                    msg = 'Username atau kata sandi salah. Pastikan akun sudah terdaftar.';
                } else if (/not confirmed/i.test(msg)) {
                    msg = 'Akun belum diaktifkan. Silakan hubungi admin (0895384287654).';
                }
                showLoginErr(msg);
                btn.disabled = false;
                label.textContent = 'Masuk ke ULMET 🚀';
            }
        });

        // ─── SUBMIT ONBOARDING ───
        document.getElementById('form-onboard').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('ob-err').classList.add('hidden');

            const btn   = document.getElementById('btn-onboard');
            const label = document.getElementById('btn-onboard-label');
            btn.disabled = true;
            label.textContent = 'Menyimpan Profil... ⏳';

            if (!loggedUser) {
                document.getElementById('ob-err').classList.remove('hidden');
                document.getElementById('ob-err-msg').textContent = 'Sesi tidak ditemukan. Muat ulang halaman.';
                btn.disabled = false; label.textContent = 'Simpan & Buka Dashboard 🚀';
                return;
            }

            const nama      = document.getElementById('ob-nama').value.trim();
            const panggilan = document.getElementById('ob-panggilan').value.trim() || nama.split(' ')[0];
            const nim       = document.getElementById('ob-nim').value.trim();
            const semester  = document.getElementById('ob-semester').value;
            const prodi     = document.getElementById('ob-prodi').value.trim();
            const avatar    = nama ? nama[0].toUpperCase() : '?';

            const profileData = { id: loggedUser.id, nama, panggilan, nim, semester, prodi, avatar };

            try {
                const { error } = await getSb()
                    .from('profiles')
                    .upsert(profileData, { onConflict: 'id' });

                if (error) throw error;

                localStorage.setItem(userKey('ulmet_profile'), JSON.stringify(profileData));
                localStorage.setItem('ulmet_profile', JSON.stringify(profileData));
                label.textContent = 'Berhasil! Membuka Dashboard... ✨';
                setTimeout(() => window.location.href = 'dashboard.html', 400);

            } catch (err) {
                document.getElementById('ob-err').classList.remove('hidden');
                document.getElementById('ob-err-msg').textContent = 'Gagal simpan: ' + err.message;
                btn.disabled = false;
                label.textContent = 'Simpan & Buka Dashboard 🚀';
            }
        });

        // ─── PULL TO REFRESH ───
        let ptrY = 0;
        document.addEventListener('touchstart', e => { ptrY = e.touches[0].clientY; }, {passive:true});
        document.addEventListener('touchend', e => {
            if (e.changedTouches[0].clientY > ptrY + 150) {
                const el = document.createElement('div');
                el.innerHTML = '<div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#facc15;padding:8px 16px;border-radius:20px;border:1px solid #1e3a8a;box-shadow:0 4px 15px rgba(0,0,0,.5);z-index:9999;font-size:12px;font-weight:bold;">⏳ Memperbarui...</div>';
                document.body.appendChild(el);
                setTimeout(() => window.location.reload(), 500);
            }
        }, {passive:true});
    </script>

    <script>
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
    </script>
</body>
</html>
