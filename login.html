<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Masuk - ULMET</title>
    
    <!-- Supabase SDK (siap digunakan nanti) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }
        
        .glass-panel {
            background: rgba(30, 58, 138, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }
        
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-20px) scale(1.1); }
        }

        /* Screen Transitions */
        .screen-enter { opacity: 0; transform: translateY(20px); transition: all 0.5s ease; pointer-events: none; }
        .screen-enter-active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .screen-exit { opacity: 1; transform: translateY(0); transition: all 0.5s ease; pointer-events: auto; }
        .screen-exit-active { opacity: 0; transform: translateY(-20px); pointer-events: none; }
    </style>
</head>
<body class="h-screen w-full overflow-hidden bg-slate-900 relative flex items-center justify-center">

    <!-- Background Decoration -->
    <div class="absolute inset-0 bg-grid z-0 pointer-events-none"></div>
    <div class="orb bg-blue-600 w-64 h-64 top-10 left-10"></div>
    <div class="orb bg-yellow-500/50 w-72 h-72 bottom-10 right-10" style="animation-delay: -5s;"></div>

    <!-- SCREEN 1: LOGIN -->
    <div id="login-screen" class="relative z-10 w-full max-w-md px-6 screen-enter-active">
        <div class="glass-panel p-8 rounded-3xl shadow-2xl flex flex-col items-center text-center">
            
            <div class="w-20 h-20 bg-gradient-to-tr from-yellow-400 to-yellow-200 rounded-2xl flex items-center justify-center shadow-lg shadow-yellow-500/20 mb-6 rotate-3">
                <span class="text-4xl font-black text-blue-950 -rotate-3">U</span>
            </div>
            
            <h1 class="text-3xl font-extrabold text-white mb-2 tracking-wide">ULMET</h1>
            <p class="text-sm text-blue-300 font-medium mb-8">Asisten Cerdas Pejuang Kampus</p>

            <button id="login-btn" onclick="simulateGoogleLogin()" class="w-full relative group overflow-hidden rounded-2xl bg-white p-[1px] transition-all hover:scale-[1.02] active:scale-95 shadow-xl shadow-white/10">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500 via-yellow-400 to-red-500 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
                <div class="relative w-full bg-white px-6 py-3.5 rounded-2xl flex items-center justify-center gap-3 pointer-events-none">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span id="btn-login-text" class="text-slate-800 font-bold text-[15px]">Lanjutkan dengan Google</span>
                </div>
            </button>
            
            <div class="mt-8 flex items-center justify-center gap-2 text-[10px] text-blue-400 font-medium">
                <span class="w-4 h-4 text-yellow-400">⚡</span>
                <p>Data tersimpan otomatis via Supabase & Google Drive</p>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: ONBOARDING DATA -->
    <div id="onboard-screen" class="relative z-10 w-full max-w-md px-6 hidden screen-enter">
        <div class="glass-panel p-6 md:p-8 rounded-3xl shadow-2xl">
            
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto bg-blue-900/60 rounded-full flex items-center justify-center mb-3 border border-blue-700/50">
                    <span class="text-2xl" id="avatar-emoji">🎓</span>
                </div>
                <h2 class="text-xl font-extrabold text-white">Selamat Datang, <span id="user-display-name" class="text-yellow-400">Mahasiswa</span>!</h2>
                <p class="text-xs text-blue-300 mt-1">Lengkapi profil kampusmu untuk melanjutkan.</p>
            </div>

            <form id="onboard-form" class="space-y-4" onsubmit="saveProfile(event)">
                
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-blue-300 uppercase tracking-wider ml-1">Nama Panggilan</label>
                    <input type="text" id="input-nama" required class="w-full bg-slate-900/60 border border-blue-800/60 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-yellow-400/50 focus:ring-1 focus:ring-yellow-400/50 transition text-sm shadow-inner" placeholder="Cth: Oqi">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-blue-300 uppercase tracking-wider ml-1">Semester</label>
                        <select id="input-semester" required class="w-full bg-slate-900/60 border border-blue-800/60 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-yellow-400/50 transition text-sm appearance-none cursor-pointer">
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5" selected>Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8 (Skripsi)</option>
                            <option value="9+">Semester 9+</option>
                        </select>
                    </div>
                    
                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-blue-300 uppercase tracking-wider ml-1">NIM / NPM</label>
                        <input type="text" id="input-nim" required class="w-full bg-slate-900/60 border border-blue-800/60 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-yellow-400/50 transition text-sm shadow-inner" placeholder="Nomor Induk">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-blue-300 uppercase tracking-wider ml-1">Program Studi</label>
                    <input type="text" id="input-prodi" required class="w-full bg-slate-900/60 border border-blue-800/60 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-yellow-400/50 transition text-sm shadow-inner" placeholder="Cth: Sastra Arab">
                </div>

                <button type="submit" id="btn-submit" class="w-full mt-6 bg-yellow-400 hover:bg-yellow-300 text-blue-950 font-extrabold py-3.5 rounded-xl shadow-[0_0_15px_rgba(250,204,21,0.3)] transition active:scale-95 flex items-center justify-center gap-2">
                    Mulai Gunakan ULMET 🚀
                </button>
            </form>
            
        </div>
    </div>

    <!-- PULL TO REFRESH SCRIPT -->
    <script>
        let ptrStartY = 0;
        let ptrIsAtTop = true;
        document.addEventListener('touchstart', (e) => {
            ptrStartY = e.touches[0].clientY;
            ptrIsAtTop = true;
        }, {passive: true});

        document.addEventListener('touchend', (e) => {
            const endY = e.changedTouches[0].clientY;
            if (ptrIsAtTop && endY > ptrStartY + 150) {
                const ptrInd = document.createElement('div');
                ptrInd.innerHTML = '<div style="position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#0f172a; color:#facc15; padding:8px 16px; border-radius:20px; border: 1px solid #1e3a8a; box-shadow:0 4px 15px rgba(0,0,0,0.5); z-index:9999; font-size:12px; font-weight:bold; display:flex; align-items:center; gap:8px;"><span>⏳</span> Memperbarui...</div>';
                document.body.appendChild(ptrInd);
                setTimeout(() => window.location.reload(), 500);
            }
        }, {passive: true});
    </script>

    <script>
        // Supabase Initialization
        const supabaseUrl = 'https://xpvwedzljeeasdorigko.supabase.co';
        const supabaseKey = 'sb_publishable_FcerT5DGq2vhdefNqeztqA_y8dYG-BH';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const loginScreen = document.getElementById('login-screen');
        const onboardScreen = document.getElementById('onboard-screen');

        // Cek sesi login saat halaman dimuat
        window.onload = async () => {
            // Bersihkan error dari URL jika ada
            if (window.location.search.includes('error=')) {
                console.warn("OAuth error detected, clearing URL.");
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    // Simpan token Google Drive jika tersedia dari Supabase (OAuth provider_token)
                    if (session.provider_token) {
                        localStorage.setItem("ulmet_gdrive_token", session.provider_token);
                    }
                    if (session.provider_refresh_token) {
                        localStorage.setItem("ulmet_gdrive_refresh", session.provider_refresh_token);
                    }
                    if (session.user && session.user.user_metadata) {
                        localStorage.setItem("ulmet_gdrive_account", JSON.stringify({
                            name: session.user.user_metadata.full_name || session.user.email,
                            email: session.user.email,
                            picture: session.user.user_metadata.avatar_url || ''
                        }));
                    }

                    // Periksa apakah user sudah punya profil (nim & prodi) di local/DB
                    const localProfile = localStorage.getItem('ulmet_profile');
                    if (localProfile) {
                        window.location.href = 'dashboard.html';
                    } else {
                        // Cek dari Database Supabase
                        const { data: dbProfile, error: dbError } = await supabaseClient
                            .from('profiles')
                            .select('*')
                            .eq('id', session.user.id)
                            .single();
                        
                        if (dbProfile && !dbError) {
                            // Profil ditemukan di DB, simpan ke local dan langsung masuk!
                            localStorage.setItem('ulmet_profile', JSON.stringify(dbProfile));
                            window.location.href = 'dashboard.html';
                        } else {
                            // Jika benar-benar belum punya data, munculkan form
                            showOnboardingForm(session.user.user_metadata.full_name || session.user.email);
                        }
                    }
                }
            } catch(e) {
                console.error("Gagal load session", e);
            }
        };

        async function simulateGoogleLogin() {
            try {
                // Ubah tombol jadi loading
                const btn = document.getElementById('btn-login-text');
                if (btn) btn.innerText = 'Menghubungkan...';
                
                // Gunakan IP saat ini sebagai redirect (dinamis, selalu tepat)
                const currentOrigin = window.location.origin;
                
                // Panggil API Supabase untuk login via Google
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        scopes: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
                        queryParams: {
                            access_type: 'offline',
                            prompt: 'consent'
                        },
                        redirectTo: currentOrigin + '/login.html'
                    }
                });

                if (error) {
                    alert("Gagal login: " + error.message);
                    if (btn) btn.innerText = 'Lanjutkan dengan Google';
                }
            } catch (err) {
                alert("Error script: " + err.message);
                const btn = document.getElementById('btn-login-text');
                if (btn) btn.innerText = 'Lanjutkan dengan Google';
            }
        }

        function showOnboardingForm(namaGoogle = 'Mahasiswa') {
            document.getElementById('user-display-name').innerText = namaGoogle;
            // Gunakan nama depan saja
            document.getElementById('input-nama').value = namaGoogle.split(' ')[0];
            
            loginScreen.classList.remove('screen-enter-active');
            loginScreen.classList.add('screen-exit-active');
            
            setTimeout(() => {
                loginScreen.classList.add('hidden');
                onboardScreen.classList.remove('hidden');
                void onboardScreen.offsetWidth;
                onboardScreen.classList.remove('screen-enter');
                onboardScreen.classList.add('screen-enter-active');
            }, 500);
        }

        async function saveProfile(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            btn.innerHTML = 'Menyimpan... ⏳';
            btn.disabled = true;

            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
            
            if (sessionError || !session) {
                alert("Gagal mendapatkan sesi login. Silakan refresh halaman.");
                btn.innerHTML = 'Mulai Gunakan ULMET 🚀';
                btn.disabled = false;
                return;
            }

            const profile = {
                id: session.user.id,
                nama: document.getElementById('input-nama').value,
                semester: document.getElementById('input-semester').value,
                nim: document.getElementById('input-nim').value,
                prodi: document.getElementById('input-prodi').value,
                avatar: document.getElementById('input-nama').value.charAt(0).toUpperCase()
            };

            // Simpan ke Supabase Database
            const { error } = await supabaseClient
                .from('profiles')
                .insert([profile]);

            if (error) {
                console.error("Gagal menyimpan ke database:", error);
                alert("Ups! Gagal menyimpan data: " + error.message);
                btn.innerHTML = 'Mulai Gunakan ULMET 🚀';
                btn.disabled = false;
            } else {
                // Simpan copy-nya ke lokal untuk kecepatan akses
                localStorage.setItem('ulmet_profile', JSON.stringify({
                    nama: profile.nama,
                    semester: profile.semester,
                    nim: profile.nim,
                    prodi: profile.prodi,
                    avatar: profile.avatar
                }));
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
